name: Publish to npm

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: npm-publish-${{ github.ref }}

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
              with:
                  node-version: "22.23.4"
                  run-install: false

            - name: Verify the release tag
              if: github.event_name == 'push'
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  version=$(node -p 'require("./package.json").version')
                  if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
                      echo "::error::Release tag must match package.json version v$version."
                      exit 1
                  fi
                  if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
                      echo "::error::Release tag must point to a commit on $DEFAULT_BRANCH."
                      exit 1
                  fi

            - name: Verify and pack the package
              run: |
                  vp install --frozen-lockfile
                  vp check
                  vp test --run
                  vp run build
                  vp run --filter example build
                  vp pm pack --out "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: npm-package
                  path: ${{ runner.temp }}/astro-loader-sveltia-cms.tgz
                  if-no-files-found: error

    publish:
        needs: build
        if: github.event_name == 'push' && github.ref_type == 'tag'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
              with:
                  node-version: "22.23.4"
                  run-install: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: npm-package
                  path: ${{ runner.temp }}

            - name: Publish with npm Trusted Publishing
              run: vp pm publish "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz" --access public --provenance -- --publish-wait-timeout 300000
