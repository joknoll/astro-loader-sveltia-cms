name: Publish to npm

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
    workflow_dispatch:
        inputs:
            publish:
                description: Publish the selected version tag
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: npm-publish-${{ github.ref }}

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
              with:
                  node-version: "22.23.4"
                  run-install: false

            - name: Verify the release tag
              if: github.event_name == 'push' || inputs.publish
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  version=$(node -p 'require("./package.json").version')
                  if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "v$version" ]]; then
                      echo "::error::Release tag must match package.json version v$version."
                      exit 1
                  fi
                  if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
                      echo "::error::Release tag must point to a commit on $DEFAULT_BRANCH."
                      exit 1
                  fi

            - name: Verify and pack the package
              run: |
                  vp install --frozen-lockfile
                  vp check
                  vp test --run
                  vp run build
                  vp run --filter example build
                  vp pm pack --out "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: npm-package
                  path: ${{ runner.temp }}/astro-loader-sveltia-cms.tgz
                  if-no-files-found: error

    publish:
        needs: build
        if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
              with:
                  node-version: "22.23.4"
                  run-install: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: npm-package
                  path: ${{ runner.temp }}

            - name: Check for an existing publish of this tarball
              id: registry
              run: |
                  node --input-type=module <<'JS'
                  import { createHash } from "node:crypto";
                  import { appendFileSync, readFileSync } from "node:fs";
                  import { join } from "node:path";

                  const { name, version } = JSON.parse(readFileSync("package.json", "utf8"));
                  const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${version}?verify=${Date.now()}`;
                  const metadata = await fetch(url, { signal: AbortSignal.timeout(10_000) });
                  if (metadata.status === 404) process.exit(0);
                  if (!metadata.ok) throw new Error(`Registry metadata returned HTTP ${metadata.status}`);

                  const { dist } = await metadata.json();
                  const tarball = readFileSync(join(process.env.RUNNER_TEMP, "astro-loader-sveltia-cms.tgz"));
                  const integrity = "sha512-" + createHash("sha512").update(tarball).digest("base64");
                  if (dist.integrity !== integrity) {
                      throw new Error(`${name}@${version} already exists with a different tarball`);
                  }
                  console.log(`npm already has this tarball for ${name}@${version}`);
                  appendFileSync(process.env.GITHUB_OUTPUT, "published=true\n");
                  JS

            - name: Publish with npm Trusted Publishing
              if: steps.registry.outputs.published != 'true'
              run: vp pm publish "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz" --access public --provenance

            - name: Verify the published download
              run: |
                  node --input-type=module <<'JS'
                  import { readFileSync } from "node:fs";
                  import { setTimeout } from "node:timers/promises";

                  const { name, version } = JSON.parse(readFileSync("package.json", "utf8"));
                  const releaseUrl = `https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`;
                  const deadline = Date.now() + 300_000;

                  function fetchFresh(url, method) {
                      // npm can cache a 404 from a request made before the tarball is available.
                      const freshUrl = new URL(url);
                      freshUrl.searchParams.set("verify", String(Date.now()));
                      return fetch(freshUrl, { method, signal: AbortSignal.timeout(10_000) });
                  }

                  let lastError;
                  while (Date.now() < deadline) {
                      try {
                          const metadata = await fetchFresh(releaseUrl, "GET");
                          if (!metadata.ok) {
                              throw new Error(`Registry metadata returned HTTP ${metadata.status}`);
                          }
                          const { dist } = await metadata.json();
                          const tarball = await fetchFresh(dist.tarball, "HEAD");
                          if (!tarball.ok) {
                              throw new Error(`Tarball returned HTTP ${tarball.status}`);
                          }
                          console.log(`Verified download for ${name}@${version}`);
                          process.exit(0);
                      } catch (error) {
                          lastError = error;
                          await setTimeout(5_000);
                      }
                  }
                  throw new Error(`Timed out verifying ${name}@${version}`, { cause: lastError });
                  JS

    notify:
        needs: [build, publish]
        if: failure() && (github.event_name == 'push' || inputs.publish)
        uses: ./.github/workflows/notify-maintainer.yml
        permissions:
            issues: write
        with:
            title: npm release needs attention
            details: Check the build and publish logs. If npm already published the same tarball, a retry will verify the download.
