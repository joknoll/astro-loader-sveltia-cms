name: Publish to npm

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
    workflow_dispatch:
        inputs:
            publish:
                description: Publish the selected version tag
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: npm-publish-${{ github.ref }}

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            artifact: ${{ steps.archive.outputs.artifact }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
              with:
                  node-version: "22.23.4"
                  run-install: false

            - name: Verify the release tag
              if: github.event_name == 'push' || inputs.publish
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  version=$(node -p 'require("./package.json").version')
                  if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "v$version" ]]; then
                      echo "::error::Release tag must match package.json version v$version."
                      exit 1
                  fi
                  if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
                      echo "::error::Release tag must point to a commit on $DEFAULT_BRANCH."
                      exit 1
                  fi

            - name: Verify and pack the package
              run: |
                  vp install --frozen-lockfile
                  vp check
                  vp test --run
                  vp run build
                  vp run --filter example build
                  vp pm pack --out "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz"
                  cd "$RUNNER_TEMP"
                  sha512sum astro-loader-sveltia-cms.tgz > astro-loader-sveltia-cms.tgz.sha512

            - name: Check packed consumers at the Astro floor and workspace version
              run: bash scripts/check-packed-consumer.sh "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz"

            - name: Save and render content in Chromium
              run: bash scripts/check-cms-browser.sh --archive "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz" --install-browser

            - name: Confirm and identify the checked artifact
              id: archive
              working-directory: ${{ runner.temp }}
              run: |
                  sha512sum --check astro-loader-sveltia-cms.tgz.sha512
                  echo "artifact=npm-package-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ steps.archive.outputs.artifact }}
                  path: |
                      ${{ runner.temp }}/astro-loader-sveltia-cms.tgz
                      ${{ runner.temp }}/astro-loader-sveltia-cms.tgz.sha512
                  if-no-files-found: error
                  retention-days: 90
                  compression-level: 0

    publish:
        needs: build
        if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
              with:
                  node-version: "22.23.4"
                  run-install: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ${{ needs.build.outputs.artifact }}
                  path: ${{ runner.temp }}

            - name: Verify the downloaded release artifact
              working-directory: ${{ runner.temp }}
              run: sha512sum --check astro-loader-sveltia-cms.tgz.sha512

            - name: Check for an existing publish of this tarball
              id: registry
              run: node scripts/check-npm-release.mjs preflight "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz"

            - name: Publish with npm Trusted Publishing
              id: publish
              if: steps.registry.outputs.published == 'false'
              continue-on-error: true
              # The build checked the tagged commit. Registry availability is checked below.
              run: >-
                  timeout --kill-after=10s 180s
                  vp pm publish "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz"
                  --access public --provenance --no-git-checks
                  -- --publish-wait-timeout 0 --registry https://registry.npmjs.org/

            - name: Verify registry integrity and downloaded bytes
              if: "!cancelled() && steps.registry.outcome == 'success'"
              run: node scripts/check-npm-release.mjs verify "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz"

            - name: Report a successful recovery after a publish error
              if: steps.publish.outcome == 'failure'
              run: echo "::warning::The publish command failed, but npm is serving the exact checked tarball."

    notify:
        needs: [build, publish]
        if: failure() && (github.event_name == 'push' || inputs.publish)
        uses: ./.github/workflows/notify-maintainer.yml
        permissions:
            issues: write
        with:
            title: npm release needs attention
            details: Check the build and publish logs. Re-run failed jobs to reuse the checked tarball and verify what npm serves.
