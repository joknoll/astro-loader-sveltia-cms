name: Verify package

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    verify:
        name: Verify package
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
              with:
                  node-version: "22.23.4"
                  run-install: false

            - name: Verify workspace and pack
              run: |
                  vp install --frozen-lockfile
                  vp check
                  vp test --run
                  vp run build
                  vp run --filter example build
                  vp pm pack --out "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz"

            - name: Check packed consumers at the Astro floor and workspace version
              run: bash scripts/check-packed-consumer.sh "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz"

            - name: Save and render content in Chromium
              run: bash scripts/check-cms-browser.sh --archive "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz" --install-browser
