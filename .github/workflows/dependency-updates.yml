name: Weekly dependency updates

on:
    schedule:
        - cron: "17 8 * * 1"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: weekly-dependency-updates

jobs:
    update:
        if: github.ref_name == github.event.repository.default_branch
        runs-on: ubuntu-latest
        timeout-minutes: 15
        container:
            image: ghcr.io/voidzero-dev/vite-plus:1
            options: --user 0
        outputs:
            changed: ${{ steps.update.outputs.changed }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Update dependencies
              id: update
              shell: bash
              run: |
                  vp install --frozen-lockfile
                  vp migrate --no-interactive --no-agent --no-editor --no-hooks
                  vp update -r
                  vp update --latest @sveltia/cms
                  vp fmt package.json example/package.json pnpm-workspace.yaml

                  if ! git diff --quiet HEAD -- . ':(exclude,top)package.json' ':(exclude,top)example/package.json' ':(exclude,top)pnpm-workspace.yaml' ':(exclude,top)pnpm-lock.yaml'; then
                      echo "::error::The update changed project files outside the dependency manifests and lockfile. Review the migration manually."
                      git diff --stat HEAD
                      exit 1
                  fi

                  git diff --binary HEAD -- package.json example/package.json pnpm-workspace.yaml pnpm-lock.yaml > "$RUNNER_TEMP/dependency-updates.patch"
                  if [[ -s "$RUNNER_TEMP/dependency-updates.patch" ]]; then
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Verify the updated workspace
              if: steps.update.outputs.changed == 'true'
              shell: bash
              run: |
                  vp install --frozen-lockfile
                  vp check
                  vp test --run
                  vp run build
                  vp run --filter example build

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: steps.update.outputs.changed == 'true'
              with:
                  name: dependency-updates
                  path: ${{ runner.temp }}/dependency-updates.patch
                  retention-days: 1

    open-pr:
        needs: update
        if: needs.update.outputs.changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: dependency-updates
                  path: ${{ runner.temp }}

            - name: Apply the verified updates
              run: |
                  git apply --include=package.json --include=example/package.json --include=pnpm-workspace.yaml --include=pnpm-lock.yaml "$RUNNER_TEMP/dependency-updates.patch"

            - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
              with:
                  branch: automation/dependency-updates
                  commit-message: Update dependencies
                  title: Update dependencies
                  body: The frozen install, checks, tests, package build, and Astro example build passed.
