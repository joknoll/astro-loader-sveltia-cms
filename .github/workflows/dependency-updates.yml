name: Weekly dependency updates

on:
    schedule:
        - cron: "17 8 * * 1"
    workflow_dispatch:
    pull_request_target:
        types: [closed]

permissions:
    contents: read

concurrency:
    group: weekly-dependency-updates

jobs:
    update:
        if: github.event_name != 'pull_request_target' && github.ref_name == github.event.repository.default_branch
        runs-on: ubuntu-latest
        timeout-minutes: 15
        container:
            image: ghcr.io/voidzero-dev/vite-plus:1
            options: --user 0
        outputs:
            changed: ${{ steps.update.outputs.changed }}
            version: ${{ steps.update.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Update dependencies
              id: update
              shell: bash
              run: |
                  vp install --frozen-lockfile
                  vp migrate --no-interactive --no-agent --no-editor --no-hooks
                  vp update -r
                  vp update --latest @sveltia/cms
                  vp fmt package.json example/package.json pnpm-workspace.yaml

                  if ! git diff --quiet HEAD -- . ':(exclude,top)package.json' ':(exclude,top)example/package.json' ':(exclude,top)pnpm-workspace.yaml' ':(exclude,top)pnpm-lock.yaml'; then
                      echo "::error::The update changed project files outside the dependency manifests and lockfile. Review the migration manually."
                      git diff --stat HEAD
                      exit 1
                  fi

                  files=(package.json example/package.json pnpm-workspace.yaml pnpm-lock.yaml)
                  if git diff --quiet HEAD -- "${files[@]}"; then
                      exit 0
                  fi

                  name=$(node -p 'require("./package.json").name')
                  current_version=$(node -p 'require("./package.json").version')
                  published_version=$(vp info "$name@latest" version)
                  if [[ "$published_version" != "$current_version" ]]; then
                      echo "::error::The version on $GITHUB_REF_NAME ($current_version) differs from npm latest ($published_version). Resolve that release before updating dependencies."
                      exit 1
                  fi
                  next_version=$(node <<'JS'
                  const { version } = require("./package.json");
                  if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
                      throw new Error(`Expected a stable package version, got ${version}`);
                  }
                  const [major, minor, patch] = version.split(".");
                  console.log(`${major}.${minor}.${BigInt(patch) + 1n}`);
                  JS
                  )
                  vp pm pkg set "version=$next_version"
                  vp fmt package.json

                  git diff --binary HEAD -- "${files[@]}" > "$RUNNER_TEMP/dependency-updates.patch"
                  printf 'changed=true\nversion=%s\n' "$next_version" >> "$GITHUB_OUTPUT"

            - name: Verify the updated workspace
              if: steps.update.outputs.changed == 'true'
              shell: bash
              run: |
                  vp install --frozen-lockfile
                  vp check
                  vp test --run
                  vp run build
                  vp run --filter example build

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: "!cancelled() && steps.update.outputs.changed == 'true'"
              with:
                  name: dependency-updates
                  path: ${{ runner.temp }}/dependency-updates.patch
                  retention-days: 7

    open-pr:
        needs: update
        if: needs.update.outputs.changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
            pull-requests: write
        outputs:
            merge_sha: ${{ steps.merge.outputs.sha }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: dependency-updates
                  path: ${{ runner.temp }}

            - name: Apply the verified updates
              run: |
                  git apply --include=package.json --include=example/package.json --include=pnpm-workspace.yaml --include=pnpm-lock.yaml "$RUNNER_TEMP/dependency-updates.patch"

            - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
              id: pr
              with:
                  branch: automation/dependency-updates
                  commit-message: Update dependencies for ${{ needs.update.outputs.version }}
                  title: Update dependencies for ${{ needs.update.outputs.version }}
                  body: The frozen install, checks, tests, package build, and Astro example build passed.

            - name: Merge the verified dependency update
              id: merge
              if: steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'closed'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
                  PR_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  base_sha=$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
                  if [[ "$base_sha" != "$GITHUB_SHA" || -z "$PR_SHA" ]]; then
                      echo "::error::The base branch changed or the pull request commit is unavailable. Review the open pull request."
                      exit 1
                  fi
                  merge_sha=$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
                      -f sha="$PR_SHA" -f merge_method=squash --jq 'select(.merged).sha')
                  test -n "$merge_sha"
                  echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"

    release:
        needs: open-pr
        if: >-
            always() && !cancelled() &&
            (needs.open-pr.outputs.merge_sha != '' ||
             (github.event_name == 'pull_request_target' &&
              github.event.pull_request.merged &&
              github.event.pull_request.base.ref == github.event.repository.default_branch &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.event.pull_request.head.ref == 'automation/dependency-updates' &&
              github.event.pull_request.user.login == 'github-actions[bot]'))
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: write
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.open-pr.outputs.merge_sha || github.event.pull_request.merge_commit_sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Tag and dispatch the release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  release_sha=$(git rev-parse HEAD)
                  git merge-base --is-ancestor "$release_sha" "origin/$DEFAULT_BRANCH"
                  version=$(node -p 'require("./package.json").version')
                  if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::Expected a stable release version, got $version."
                      exit 1
                  fi

                  tag="v$version"
                  tag_sha=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk 'END { print $1 }')
                  if [[ -z "$tag_sha" ]]; then
                      gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$release_sha" --silent
                  elif [[ "$tag_sha" != "$release_sha" ]]; then
                      echo "::error::Tag $tag already points to another commit."
                      exit 1
                  fi

                  printf '{"publish":true}\n' | gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" --json

    notify:
        needs: [update, open-pr, release]
        if: failure()
        uses: ./.github/workflows/notify-maintainer.yml
        permissions:
            issues: write
        with:
            title: Dependency updates need attention
            details: Check the failed job. The run may include a dependency patch to review, an open update PR to merge, or a tag ready for the publish workflow.
