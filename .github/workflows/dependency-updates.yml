name: Weekly dependency updates

on:
    schedule:
        - cron: "17 8 * * 1"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: weekly-dependency-updates

jobs:
    update:
        if: github.ref_name == github.event.repository.default_branch
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            changed: ${{ steps.update.outputs.changed }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
              with:
                  node-version: "22.23.4"
                  run-install: false

            - name: Update dependencies
              id: update
              shell: bash
              run: |
                  vp install --frozen-lockfile
                  vp migrate --no-interactive --no-agent --no-editor --no-hooks
                  # Keep major CMS and Astro migrations in dedicated reviewed PRs.
                  vp update -r
                  vp fmt package.json example/package.json pnpm-workspace.yaml

                  unexpected=$(git diff --name-only HEAD -- . ':(exclude,top)package.json' ':(exclude,top)example/package.json' ':(exclude,top)pnpm-workspace.yaml' ':(exclude,top)pnpm-lock.yaml')
                  untracked=$(git ls-files --others --exclude-standard)
                  if [[ -n "$unexpected" || -n "$untracked" ]]; then
                      echo "::error::The update changed project files outside the dependency manifests and lockfile. Review the migration manually."
                      printf '%s\n' "$unexpected" "$untracked"
                      exit 1
                  fi

                  files=(package.json example/package.json pnpm-workspace.yaml pnpm-lock.yaml)
                  patch="$RUNNER_TEMP/dependency-updates.patch"
                  git diff --binary HEAD -- "${files[@]}" > "$patch"
                  if [[ -s "$patch" ]]; then
                      printf 'changed=true\n' >> "$GITHUB_OUTPUT"
                  fi

            - name: Verify the updated workspace
              if: steps.update.outputs.changed == 'true'
              shell: bash
              run: |
                  vp install --frozen-lockfile
                  vp check
                  vp test --run
                  vp run build
                  vp run --filter example build
                  vp pm pack --out "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz"

            - name: Check packed consumers at the Astro floor and updated workspace version
              if: steps.update.outputs.changed == 'true'
              run: bash scripts/check-packed-consumer.sh "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: "!cancelled() && steps.update.outputs.changed == 'true'"
              with:
                  name: dependency-updates
                  path: ${{ runner.temp }}/dependency-updates.patch
                  retention-days: 7

    open-pr:
        needs: update
        if: needs.update.outputs.changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: dependency-updates
                  path: ${{ runner.temp }}

            - name: Apply the verified updates
              run: |
                  git apply --include=package.json --include=example/package.json --include=pnpm-workspace.yaml --include=pnpm-lock.yaml "$RUNNER_TEMP/dependency-updates.patch"

            - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
              with:
                  branch: automation/dependency-updates
                  base: ${{ github.event.repository.default_branch }}
                  commit-message: Update dependencies
                  title: Update dependencies
                  body: |
                      The frozen install, checks, tests, package and example builds, and packed-consumer checks passed.
                      If GitHub requests approval to run the PR checks, approve the workflows before merging.
                      Review the dependency changes and any consumer migrations before merging. Releases are manual.

    notify:
        needs: [update, open-pr]
        if: failure()
        uses: ./.github/workflows/notify-maintainer.yml
        permissions:
            issues: write
        with:
            title: Dependency updates need attention
            details: Check the failed job for dependency changes or migration work that needs review.
