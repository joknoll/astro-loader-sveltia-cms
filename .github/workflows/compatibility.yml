name: Compatibility probes

on:
    schedule:
        - cron: "41 8 * * 4"
    workflow_dispatch:
    pull_request:
        paths:
            - .github/workflows/compatibility.yml
            - scripts/browser/**
            - scripts/check-cms-browser.sh

permissions:
    contents: read

jobs:
    scheduled-consumer:
        name: Latest supported Astro / Node ${{ matrix.node }} / ${{ matrix.manager }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                node: ["24", "26"]
                manager: [pnpm, npm]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
              with:
                  node-version: ${{ matrix.node }}
                  run-install: false

            - name: Pack from the frozen workspace
              run: |
                  vp install --frozen-lockfile
                  vp run build
                  vp pm pack --out "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz"

            - name: Check against the newest Astro in the peer range
              env:
                  PACKAGE_MANAGER: ${{ matrix.manager }}
              run: bash scripts/check-packed-consumer.sh "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz" latest "$PACKAGE_MANAGER"

    extended:
        name: MDX, Node SSR and candidate CMS
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
              with:
                  node-version: "22.23.4"
                  run-install: false

            - name: Test MDX, SSR and native loaders beside the admin
              run: |
                  vp install --frozen-lockfile
                  vp run build
                  vp pm pack --out "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz"
                  bash scripts/check-astro-adapters.sh "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz"

            - name: Check the staged CMS candidate in Chromium
              run: bash scripts/check-cms-browser.sh --candidate --install-browser

            - name: Check provider sign-in screens without authenticating
              run: |
                  for provider in github gitlab gitea forgejo; do
                      CMS_BROWSER_PROVIDER="$provider" bash scripts/check-cms-browser.sh --archive "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz"
                  done

    browser-compatibility:
        name: CMS round trip / ${{ matrix.browser }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                browser: [firefox, webkit]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
              with:
                  node-version: "22.23.4"
                  run-install: false

            - name: Pack and run the browser probe
              env:
                  CMS_BROWSER_ENGINE: ${{ matrix.browser }}
              run: |
                  vp install --frozen-lockfile
                  vp run build
                  vp pm pack --out "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz"
                  bash scripts/check-cms-browser.sh --archive "$RUNNER_TEMP/astro-loader-sveltia-cms.tgz" --install-browser
